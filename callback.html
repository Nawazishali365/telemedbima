    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMA Health - Transaction Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .container {
            background: white;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 430px;
            width: 100%;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        @media (min-width: 431px) {
            body {
                padding: 20px;
            }

            .container {
                min-height: auto;
                height: auto;
                max-height: 95vh;
                border-radius: 24px;
            }
        }

        @media (min-width: 501px) {
            .container {
                height: auto;
                max-height: 98vh;
                border-radius: 20px;
            }
        }

        .logo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 5px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
            max-width: 150px;
            background: white;
            padding: 6px;
            border-radius: 8px;
        }

        .heading {
            display: block;
            margin-bottom: 15px;
        }

        .heading h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            letter-spacing: -0.5px;
        }

        .doctor-image {
            width: auto;
            max-width: 100%;
            max-height: 35vh;
            height: auto;
            margin: 0 auto 10px;
            display: block;
            object-fit: contain;
        }

        .result-container {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: 3px solid #ff6b6b;
            border-radius: 18px;
            padding: 18px;
            margin-top: 12px;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.25);
            text-align: left;
            transition: all 0.3s ease;
        }

        .result-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 15px;
            color: #333;
            font-weight: 700;
            word-break: break-all;
        }

        .status-success {
            color: #1db97b !important;
        }

        .status-error {
            color: #e74c3c !important;
        }

        .home-btn {
            width: 100%;
            background: linear-gradient(135deg, #4ecca7 0%, #3aab8e 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(78, 204, 167, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 204, 167, 0.4);
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px 12px;
            }

            .logo-img {
                height: 40px;
            }

            .heading h1 {
                font-size: 24px;
            }

            .result-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <img src="bima_logo.jpg" alt="BIMA" class="logo-img">
        </div>

        <div class="heading">
            <h1>Transaction Result</h1>
        </div>

        <img src="doctor.webp" alt="Specialist Doctor" class="doctor-image">

        <div class="result-container" id="resultContainer">
            <div class="result-item">
                <div class="result-label">Status</div>
                <div class="result-value" id="resStatus">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Message</div>
                <div class="result-value" id="resMessage">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">Transaction Ref No</div>
                <div class="result-value" id="resTrxRefNo">-</div>
            </div>
        </div>

        <a href="/" class="home-btn">Return to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcrAr64iAFaj8nyRQD575ZR_hfm0rEX2I",
            authDomain: "bima-telemedicine.firebaseapp.com",
            projectId: "bima-telemedicine",
            storageBucket: "bima-telemedicine.firebasestorage.app",
            messagingSenderId: "546079503906",
            appId: "1:546079503906:web:fb1f2035431aa4ff8a7c7b",
            measurementId: "G-3HF87WXJPG"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Helper: SHA-256 Hashing
        async function sha256(msg) {
            const msgBuffer = new TextEncoder().encode(msg);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Parse URL parameters and display dynamic callback information
        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);

            // Extract campaignCode parameter from URL or sessionStorage
            const rawCampaignCode = (params.get('campaignCode') || params.get('campaign') || sessionStorage.getItem('campaign_code') || 'default').trim();
            
            // Fetch dynamic campaign parameters from campaigns.json API
            let cVars = {
                campaignCode: rawCampaignCode,
                campaignPlatform: 'meta',
                pixelId: '',
                productCode: 'bima_telemed_voucher',
                price: 300,
                currency: 'PKR',
                events: {}
            };

            try {
                const res = await fetch(`/api/campaign/${rawCampaignCode}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.config) {
                        cVars = data.config;
                        console.log('✅ Dynamic callback loaded campaign config:', cVars);
                    }
                }
            } catch (e) {
                console.warn('Failed to fetch campaign config for callback page, using defaults:', e);
            }

            const platform = (cVars.campaignPlatform || 'meta').toLowerCase();
            const pixelId = cVars.pixelId || '';
            const productCode = cVars.productCode || 'bima_telemed_voucher';
            const price = Number(cVars.price) || 300;
            const currency = cVars.currency || 'PKR';
            const events = cVars.events || {};

            // Dynamic Home button destination
            const paramSource = params.get('source');
            const sessionSource = sessionStorage.getItem('jazzcash_source');
            const referrer = document.referrer;

            let source = paramSource || sessionSource || '';
            if (!source && referrer) {
                if (referrer.includes('BimaVoucher')) source = 'BimaVoucher/index3.html';
                else if (referrer.includes('index3')) source = 'BimaVoucher/index3.html';
                else if (referrer.includes('BimaTelemedicine')) source = 'BimaTelemedicine/index.html';
            }
            if (!source) source = 'BimaVoucher/index3.html';

            const homeBtn = document.querySelector('.home-btn');
            if (homeBtn) {
                if (source.includes('index3')) {
                    homeBtn.href = `/BimaVoucher/index3.html?campaignCode=${encodeURIComponent(rawCampaignCode)}`;
                } else if (source.includes('index2')) {
                    homeBtn.href = '/BimaVoucher/index2.html';
                } else if (source.includes('BimaTelemedicine')) {
                    homeBtn.href = '/BimaTelemedicine/';
                } else {
                    homeBtn.href = `/BimaVoucher/index3.html?campaignCode=${encodeURIComponent(rawCampaignCode)}`;
                }
            }

            const rawStatus = (params.get('status') || params.get('pp_ResponseCode') || 'N/A').trim();
            const rawMessage = (params.get('message') || params.get('pp_ResponseMessage') || 'No message provided').trim();
            const trxRefNo = params.get('trxRefNo') || params.get('pp_TxnRefNo') || params.get('pp_RetrievalReferenceNo') || 'N/A';

            const statusEl = document.getElementById('resStatus');
            const messageEl = document.getElementById('resMessage');
            const trxRefNoEl = document.getElementById('resTrxRefNo');

            const isExplicitFailure = (
                rawStatus === '0' ||
                rawStatus.toLowerCase() === 'fail' ||
                rawStatus.toLowerCase() === 'failed' ||
                rawStatus.toLowerCase().includes('error')
            );

            const isSuccess = !isExplicitFailure && (
                rawStatus === '000' ||
                rawStatus === '121' ||
                rawStatus === '200' ||
                rawStatus === '1' ||
                rawStatus.toLowerCase().includes('success') ||
                rawMessage.toLowerCase().includes('success') ||
                rawMessage.toLowerCase().includes('approved') ||
                rawMessage.toLowerCase().includes('completed')
            );

            let displayMessage = rawMessage;
            let displayStatus = rawStatus;

            if (isSuccess) {
                displayStatus = "Successful!";
                displayMessage = (rawMessage && rawMessage !== 'No message provided') ? rawMessage : "JazzCash Account Linked Successfully!";
            } else if (rawStatus === '0' || rawStatus.toLowerCase().includes('fail') || rawStatus.toLowerCase().includes('error')) {
                displayStatus = "Failed!";
                displayMessage = (rawMessage && rawMessage !== 'No message provided') ? rawMessage : "JazzCash Account Linkage Failed!";
            }

            statusEl.textContent = displayStatus;
            messageEl.textContent = displayMessage;
            trxRefNoEl.textContent = trxRefNo;

            const userPhone = sessionStorage.getItem('user_phone_e164');

            if (isSuccess) {
                statusEl.classList.add('status-success');
                const container = document.getElementById('resultContainer');
                if (container) {
                    container.style.borderColor = '#4ecca7';
                    container.style.boxShadow = '0 8px 25px rgba(78, 204, 167, 0.25)';
                }

                console.log('✅ Payment Successful! Triggering conversion & purchase events...');

                // Deduplication guard: ensure purchase events fire exactly ONCE per transaction
                const guardKey = 'purchase_event_fired_' + (trxRefNo || 'default');
                if (sessionStorage.getItem(guardKey)) {
                    console.log('ℹ Conversion events already recorded for transaction:', trxRefNo);
                    return;
                }
                sessionStorage.setItem(guardKey, 'true');

                /* ── 1. META PLATFORM PURCHASE BLOCK ── */
                if (platform === 'meta' && pixelId) {
                    const purchaseEvent = events.purchase || 'Purchase';
                    const metaPurchaseParams = {
                        value: price,
                        currency: currency,
                        content_ids: [productCode],
                        content_type: 'product',
                        content_name: 'BIMA Telemedicine Voucher',
                        campaign_code: rawCampaignCode,
                        pixel_id: pixelId,
                        transaction_id: trxRefNo
                    };

                    if (typeof fbq === 'function') {
                        if (userPhone) {
                            sha256(userPhone).then(hashedPhone => {
                                fbq('init', pixelId, { ph: hashedPhone });
                                fbq('track', purchaseEvent, metaPurchaseParams);
                            }).catch(() => {
                                fbq('init', pixelId);
                                fbq('track', purchaseEvent, metaPurchaseParams);
                            });
                        } else {
                            fbq('init', pixelId);
                            fbq('track', purchaseEvent, metaPurchaseParams);
                        }
                    }
                }
                /* ── 2. TIKTOK PLATFORM PURCHASE BLOCK ── */
                else if (platform === 'tiktok' && pixelId) {
                    const purchaseEvent = events.purchase || 'CompletePayment';
                    const tiktokPurchaseParams = {
                        content_id: productCode,
                        content_type: 'product',
                        content_name: 'BIMA Telemedicine Voucher',
                        content_category: 'Healthcare',
                        price: price,
                        value: price,
                        currency: currency,
                        quantity: 1,
                        campaign_code: rawCampaignCode,
                        pixel_id: pixelId,
                        contents: [{
                            content_id: productCode,
                            content_name: 'BIMA Telemedicine Voucher',
                            content_category: 'Healthcare',
                            price: price,
                            quantity: 1
                        }]
                    };

                    if (window.ttq) {
                        if (!window._ttqLoadedPixels) window._ttqLoadedPixels = {};
                        if (!window._ttqLoadedPixels[pixelId]) {
                            try { window.ttq.load(pixelId); } catch (e) { }
                            window._ttqLoadedPixels[pixelId] = true;
                        }
                        if (userPhone) {
                            sha256(userPhone).then(hashedPhone => {
                                window.ttq.identify({ phone_number: hashedPhone });
                                window.ttq.track(purchaseEvent, tiktokPurchaseParams);
                            }).catch(() => {
                                window.ttq.track(purchaseEvent, tiktokPurchaseParams);
                            });
                        } else {
                            window.ttq.track(purchaseEvent, tiktokPurchaseParams);
                        }
                    }
                }
                /* ── 3. GOOGLE PLATFORM PURCHASE BLOCK ── */
                else if (platform === 'google' && pixelId) {
                    const purchaseEvent = events.purchase || 'purchase';
                    const googlePurchaseParams = {
                        value: price,
                        currency: currency,
                        transaction_id: trxRefNo,
                        campaign_code: rawCampaignCode,
                        send_to: pixelId,
                        items: [{
                            id: productCode,
                            name: 'BIMA Telemedicine Voucher',
                            category: 'Healthcare',
                            price: price,
                            quantity: 1
                        }]
                    };

                    if (typeof gtag === 'function') {
                        gtag('config', pixelId);
                        gtag('event', purchaseEvent, googlePurchaseParams);
                    }
                }

                // Firebase Analytics Purchase event
                logEvent(analytics, 'Purchase', {
                    value: price,
                    currency: currency,
                    transaction_id: trxRefNo,
                    content_type: 'insurance',
                    content_name: 'BIMA Telemedicine Campaign',
                    campaign_code: rawCampaignCode,
                    debug_mode: true
                });

            } else {
                statusEl.classList.add('status-error');

                /* ── 1. META PLATFORM FAILURE BLOCK ── */
                if (platform === 'meta' && pixelId) {
                    const failureEvent = events.purchase_failed || 'Purchase Failed';
                    if (typeof fbq === 'function') {
                        fbq('trackCustom', failureEvent, { campaign_code: rawCampaignCode, pixel_id: pixelId });
                    }
                }
                /* ── 2. TIKTOK PLATFORM FAILURE BLOCK ── */
                else if (platform === 'tiktok' && pixelId) {
                    const failureEvent = events.purchase_failed || 'Purchase Failed';
                    if (window.ttq) {
                        if (!window._ttqLoadedPixels) window._ttqLoadedPixels = {};
                        if (!window._ttqLoadedPixels[pixelId]) {
                            try { window.ttq.load(pixelId); } catch (e) { }
                            window._ttqLoadedPixels[pixelId] = true;
                        }
                        window.ttq.track(failureEvent, {
                            content_type: 'product',
                            content_id: productCode,
                            content_name: 'BIMA Telemedicine Voucher',
                            campaign_code: rawCampaignCode,
                            pixel_id: pixelId
                        });
                    }
                }
                /* ── 3. GOOGLE PLATFORM FAILURE BLOCK ── */
                else if (platform === 'google' && pixelId) {
                    const failureEvent = events.purchase_failed || 'Purchase Failed';
                    if (typeof gtag === 'function') {
                        gtag('event', failureEvent, { campaign_code: rawCampaignCode, send_to: pixelId });
                    }
                }

                logEvent(analytics, 'Purchase Failed', {
                    content_type: 'insurance',
                    content_name: 'BIMA Telemedicine Campaign',
                    campaign_code: rawCampaignCode,
                    debug_mode: true
                });
            }
        });
    </script>
</body>

</html>
