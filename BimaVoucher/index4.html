    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d2743;
            /* Dark background behind the container frame */
            height: 100vh;
            height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #ffffff;
            overflow: hidden;
        }

        /* 
           Responsive Aspect Ratio Container 
           Locks layout to 9:16 (1080x1920) matching the design image.
           Guarantees no scrollbars on any device or viewport.
        */
        .container {
            container-type: inline-size;
            position: relative;
            width: 100vw;
            height: 177.78vw;
            /* 16/9 ratio of viewport width */
            max-height: 100vh;
            max-height: 100dvh;
            max-width: 56.25vh;
            /* 9/16 ratio of viewport height */
            max-width: 56.25dvh;
            background-image: url('campaign2 artwork.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (max-width: 480px) and (max-aspect-ratio: 9/16) {

            /* Full screen on mobile tall viewports */
            .container {
                box-shadow: none;
            }
        }

        /* Form Overlay container spanning the lower portion */
        .form-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        /* 
           Input Box Overlay 
           Position: y=1156 to 1260, x=124 to 753 in 900x1600 campaign2 artwork
           Left: 13.78%, Top: 72.25%, Width: 70.00%, Height: 6.56%
        */
        .input-box-overlay {
            position: absolute;
            left: 13.78%;
            top: 72.25%;
            width: 70.00%;
            height: 6.56%;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        /* 
           Input field covering the text area to the right of the artwork's printed JazzCash logo & divider.
           Using transparent background so it seamlessly blends with the artwork's printed white pill box!
        */
        .phone-input {
            position: absolute;
            left: 20.5%;
            top: 0;
            width: 79.5%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent !important;
            color: #1e293b;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-size: clamp(13px, 3.6cqw, 18px);
            font-weight: 500;
            padding: 0 12px;
        }

        .phone-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .phone-input:-webkit-autofill,
        .phone-input:-webkit-autofill:hover,
        .phone-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #1e293b;
            -webkit-box-shadow: 0 0 0px 1000px transparent inset !important;
            box-shadow: 0 0 0px 1000px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 
           Subscribe Button Overlay
           Position: y=1298 to 1404, x=123 to 754 in 900x1600 campaign2 artwork
           Left: 13.67%, Top: 81.125%, Width: 70.22%, Height: 6.68%
           Using transparent background to overlay directly over the artwork's printed white button!
        */
        .subscribe-btn-overlay {
            position: absolute;
            left: 13.67%;
            top: 81.125%;
            width: 70.22%;
            height: 6.68%;
            background: transparent;
            color: #16497B;
            border: none;
            border-radius: 9999px;
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-size: clamp(15px, 4.2cqw, 21px);
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
        }

        .subscribe-btn-overlay:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.015);
        }

        .subscribe-btn-overlay:active {
            transform: scale(0.985);
        }

        .subscribe-btn-overlay:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* White text price info centered under the Subscribe button */
        .price-info {
            position: absolute;
            left: 0;
            top: 88.4%;
            width: 100%;
            text-align: center;
            font-size: 14.5px;
            font-size: clamp(10.5px, 2.8cqw, 14.5px);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        /* Consent Container (perfectly centered flex container to align checkbox and text) */
        .consent-container {
            position: absolute;
            left: 13.67%;
            width: 70.22%;
            top: 90.8%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 10;
        }

        .consent-label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            user-select: none;
        }

        /* White text consent overlay with active hyperlink */
        .consent-text {
            color: #ffffff;
            font-size: 10.5px;
            font-size: clamp(9px, 2.1cqw, 10.5px);
            line-height: 1.35;
            text-align: left;
            font-weight: 400;
        }

        .consent-text a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .consent-text a:hover {
            color: #FFE100;
        }

        /* Toast notifications */
        #toastMsg {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
            max-width: 90vw;
            text-align: center;
        }

        /* Custom Alert Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 39, 67, 0.85);
            /* Semi-transparent background matching theme color */
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(135deg, #133a63 0%, #0d2743 100%);
            border: 2px solid #1e4d7d;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 30px 24px 24px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #ffffff;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 225, 0, 0.15);
            /* Yellow tinted glow */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFE100;
            /* Yellow highlight color */
            animation: pulse-glow 2s infinite;
        }

        .modal-icon svg {
            width: 32px;
            height: 32px;
        }

        .modal-body {
            margin-bottom: 28px;
        }

        .modal-body p {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            color: #f1f5f9;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
        }

        .modal-btn {
            background-color: #FFE100;
            color: #0d2743;
            border: none;
            border-radius: 50px;
            padding: 12px 48px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 225, 0, 0.3);
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .modal-btn:active {
            transform: translateY(0);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 225, 0, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 225, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 225, 0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Interactive Overlay Form -->
        <form class="form-overlay" onsubmit="handleSubmit(event)">
            <!-- Phone Number Input Wrapper -->
            <div class="input-box-overlay">
                <input type="tel" class="phone-input" id="phoneNumber" placeholder="Enter your Jazzcash number" required
                    pattern="(03|3)[0-9]{9}" title="Please enter a valid JazzCash mobile number (e.g. 03XXXXXXXXX)">
            </div>

            <!-- Subscribe Action Button -->
            <button type="submit" class="subscribe-btn-overlay">Subscribe</button>

            <!-- Price Info Text (now rendered as White HTML text over the painted block) -->
            <div class="price-info" id="priceInfoEl">Only Rs. 10/Day  Full family covered</div>

            <!-- Consent Row (combining visible styled checkbox and text in a single container for perfect layout) -->
            <div class="consent-container">
                <label class="consent-label" for="consentCheckbox">
                    <input type="checkbox" id="consentCheckbox"
                        style="margin-top: 2px; margin-right: 6px; width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; accent-color: #FFE100;"
                        checked required>
                    <span class="consent-text">
                        By clicking Subscribe, you accept the <a
                            href="terms_and_conditions_bima.html?returnUrl=index4.html" id="termsLink" target="_blank"
                            onclick="sessionStorage.setItem('tc_return_url', window.location.href)">Terms &
                            Conditions</a>
                    </span>
                </label>
            </div>
        </form>
    </div>

    <!-- Toast Notification Box -->
    <div id="toastMsg"></div>

    <!-- Custom Alert Modal -->
    <div id="customAlert" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            </div>
            <div class="modal-body">
                <p id="customAlertMessage">You're already registered to Telemedicine Product, please reachout to 042 111
                    11 9878</p>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeCustomAlert()" class="modal-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        /*  Dynamic Campaign Parameters State (100% dynamically loaded from campaigns.json)  */
        window.CAMPAIGN_VARS = {
            campaignCode: '',
            campaignPlatform: 'meta', // Meta events by default for index4.html
            pixelId: '',
            productCode: '',
            price: 300,
            currency: 'PKR',
            events: {}
        };

        /*  Utility: Custom Alert Modal  */
        function showCustomAlert(message) {
            const modal = document.getElementById('customAlert');
            const messageEl = document.getElementById('customAlertMessage');
            messageEl.textContent = message;
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlert');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        /*  Utility: Toast  */
        function showToast(message, isSuccess) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = message;
            toast.style.background = isSuccess ? '#1db97b' : '#e74c3c';
            toast.style.display = 'block';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => { toast.style.display = 'none'; }, 400);
            }, 4000);
        }

        /*  Utility: Button loading state  */
        function setLoading(isLoading) {
            const btn = document.querySelector('.subscribe-btn-overlay');
            btn.disabled = isLoading;
            btn.textContent = isLoading ? 'Please wait' : 'Subscribe';
            btn.style.opacity = isLoading ? '0.7' : '1';
        }

        /*  Helper: SHA-256 Hashing  */
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Tracking Helper Functions (Picks all event names dynamically from campaign config)
        const META_STANDARD_EVENTS = [
            'AddPaymentInfo', 'AddToCart', 'AddToWishlist', 'CompleteRegistration',
            'Contact', 'CustomizeProduct', 'Donate', 'FindLocation', 'InitiateCheckout',
            'Lead', 'PageView', 'Purchase', 'Schedule', 'Search', 'StartTrial',
            'SubmitApplication', 'Subscribe', 'ViewContent'
        ];

        function fireMetaEvent(pixelId, eventName, params, e164Phone) {
            if (!pixelId || !eventName || typeof fbq !== 'function') return;
            const isStandard = META_STANDARD_EVENTS.includes(eventName);
            const fire = () => {
                if (isStandard) {
                    fbq('track', eventName, params);
                } else {
                    fbq('trackCustom', eventName, params);
                }
            };
            if (e164Phone) {
                sha256(e164Phone).then(h => {
                    fbq('init', pixelId, { ph: h });
                    fire();
                }).catch(() => {
                    fbq('init', pixelId);
                    fire();
                });
            } else {
                fbq('init', pixelId);
                fire();
            }
        }

        function fireTikTokEvent(pixelId, eventName, params, e164Phone) {
            if (!pixelId || !eventName || !window.ttq) return;
            if (!window._ttqLoadedPixels) window._ttqLoadedPixels = {};
            if (!window._ttqLoadedPixels[pixelId]) {
                try { window.ttq.load(pixelId, { autoConfig: false }); } catch (e) { }
                window._ttqLoadedPixels[pixelId] = true;
            }
            if (e164Phone) {
                sha256(e164Phone).then(h => {
                    window.ttq.identify({ phone_number: h });
                    window.ttq.track(eventName, params);
                }).catch(() => {
                    window.ttq.track(eventName, params);
                });
            } else {
                window.ttq.track(eventName, params);
            }
        }

        function fireGoogleEvent(pixelId, eventName, params) {
            if (!pixelId || !eventName || typeof gtag !== 'function') return;
            gtag('config', pixelId);
            gtag('event', eventName, Object.assign({ send_to: pixelId }, params));
        }

        let _isSubmitting = false;

        async function handleSubmit(event) {
            event.preventDefault();

            if (_isSubmitting) return;  // prevent double submission
            _isSubmitting = true;

            const consentChecked = document.getElementById('consentCheckbox').checked;
            if (!consentChecked) {
                showToast('Please check the box to agree to the Terms & Conditions.', false);
                _isSubmitting = false;
                return;
            }

            const phoneNumberInput = document.getElementById('phoneNumber').value.trim();

            // Standardize phone number format
            let rawNum = phoneNumberInput.replace(/[^0-9]/g, '');
            if (rawNum.startsWith('92') && rawNum.length > 10) {
                rawNum = rawNum.substring(2);
            }
            if (rawNum.startsWith('0')) {
                rawNum = rawNum.substring(1);
            }

            if (rawNum.length !== 10 || !rawNum.startsWith('3')) {
                showToast('Please enter a valid 10 or 11-digit mobile number.', false);
                _isSubmitting = false;
                return;
            }

            // Standardize format: "0" + 10-digit number (e.g. 03XXXXXXXXX)
            const msisdn = '0' + rawNum;
            console.log('Processed MSISDN:', msisdn);

            // Format phone number to E.164 format (+923XXXXXXXXX) for matching
            const e164_phone = '+92' + rawNum;
            sessionStorage.setItem('user_phone_e164', e164_phone);

            // Access active campaign variables
            const cVars = window.CAMPAIGN_VARS || {};
            const campaignCode = cVars.campaignCode || 'default';
            const platform = (cVars.campaignPlatform || 'meta').toLowerCase();
            const pixelId = cVars.pixelId || '';
            const productCode = cVars.productCode || 'bima_telemed_voucher';
            const price = Number(cVars.price) || 300;
            const currency = cVars.currency || 'PKR';
            const events = cVars.events || {};

            setLoading(true);

            try {
                // Step 1: Campaign Service search
                const serviceRes = await fetch('/api/campaign-service-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msisdn, campaignCode, productCode })
                });
                const serviceData = await serviceRes.json().catch(() => ({}));
                console.log('Service response:', serviceData);

                if (!serviceRes.ok) {
                    throw new Error(serviceData.message || serviceData.error || 'Service lookup failed: ' + serviceRes.status);
                }

                // Check if customer is already registered
                const findAllFields = (obj, key) => {
                    let results = [];
                    if (!obj || typeof obj !== 'object') return results;
                    if (obj[key] !== undefined) results.push(obj[key]);
                    if (Array.isArray(obj)) {
                        for (let item of obj) results = results.concat(findAllFields(item, key));
                    } else {
                        for (let k in obj) {
                            if (typeof obj[k] === 'object') results = results.concat(findAllFields(obj[k], key));
                        }
                    }
                    return results;
                };

                const subscriptionStatuses = findAllFields(serviceData, 'subscriptionStatus');
                const isAlreadyRegistered = subscriptionStatuses.some(status =>
                    status && ['NO_PAY', 'ACTIVE', 'CONFIRMED'].includes(status.toUpperCase())
                );

                if (isAlreadyRegistered) {
                    // Duplicate: only fire duplicate event from campaign config
                    const duplicateEventName = events.duplicate;
                    if (duplicateEventName) {
                        if (platform === 'meta') {
                            fireMetaEvent(pixelId, duplicateEventName, { campaign_code: campaignCode, pixel_id: pixelId }, e164_phone);
                        } else if (platform === 'tiktok') {
                            fireTikTokEvent(pixelId, duplicateEventName, { campaign_code: campaignCode, pixel_id: pixelId }, e164_phone);
                        } else if (platform === 'google') {
                            fireGoogleEvent(pixelId, duplicateEventName, { campaign_code: campaignCode });
                        }
                    }
                    setLoading(false);
                    // _isSubmitting stays true - prevents HE from re-triggering submission
                    showCustomAlert("You're already registered to Telemedicine Product, please reachout to 042 111 11 9878");
                    return;
                }

                // New user only: fire initiate_checkout tracking from campaign config
                const checkoutEventName = events.initiate_checkout;
                if (checkoutEventName) {
                    if (platform === 'meta') {
                        fireMetaEvent(pixelId, checkoutEventName, {
                            content_ids: [productCode],
                            content_type: 'product',
                            content_name: 'BIMA Telemedicine Voucher',
                            value: price,
                            currency: currency,
                            campaign_code: campaignCode,
                            pixel_id: pixelId
                        }, e164_phone);
                    } else if (platform === 'tiktok') {
                        fireTikTokEvent(pixelId, checkoutEventName, {
                            content_id: productCode,
                            content_type: 'product',
                            content_name: 'BIMA Telemedicine Voucher',
                            content_category: 'Healthcare',
                            price: price,
                            value: price,
                            currency: currency,
                            quantity: 1,
                            campaign_code: campaignCode,
                            pixel_id: pixelId,
                            contents: [{
                                content_id: productCode,
                                content_name: 'BIMA Telemedicine Voucher',
                                content_category: 'Healthcare',
                                price: price,
                                quantity: 1
                            }]
                        }, e164_phone);
                    } else if (platform === 'google') {
                        fireGoogleEvent(pixelId, checkoutEventName, {
                            value: price,
                            currency: currency,
                            campaign_code: campaignCode,
                            items: [{
                                id: productCode,
                                name: 'BIMA Telemedicine Voucher',
                                price: price,
                                quantity: 1
                            }]
                        });
                    }
                }

                const paymentSessionToken = serviceData.paymentSessionToken;
                if (!paymentSessionToken) {
                    throw new Error('Verification session token missing from service response');
                }

                //  Step 2: Fetch JazzCash DTC Form Data using session token 
                const formRes = await fetch(`/api/jazzcash-form?token=${encodeURIComponent(paymentSessionToken)}`);
                const formData = await formRes.json();
                console.log(' JazzCash form configuration:', formData);

                if (!formRes.ok) {
                    throw new Error(formData.error || 'Failed to construct payment payload');
                }

                showToast(' Redirecting to JazzCash payment page', true);

                // Build dynamic form submit redirect
                const jcForm = document.createElement('form');
                jcForm.method = 'POST';
                jcForm.action = formData.actionUrl;

                const excludedKeys = ['actionUrl'];
                Object.entries(formData).forEach(([key, val]) => {
                    if (excludedKeys.includes(key)) return;
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = val || '';
                    jcForm.appendChild(input);
                });

                document.body.appendChild(jcForm);
                sessionStorage.setItem('jazzcash_source', 'BimaVoucher/index4.html');
                sessionStorage.setItem('campaign_code', campaignCode);

                setTimeout(() => jcForm.submit(), 1000);

            } catch (err) {
                console.error('Activation pipeline failed:', err);
                showToast('[!] ' + (err.message || 'Something went wrong. Please check your connection and try again.'), false);
                setLoading(false);
                _isSubmitting = false; // only reset on error so user can retry
            }
        }

        /* -- Keep input digits only -- */
        document.getElementById('phoneNumber').addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        /*  Display MSISDN if received from POST request, URL parameter, or HE headers & Fetch Campaign Details  */
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Extract campaignCode parameter from URL query string
            const rawCampaignCode = (urlParams.get('campaignCode') || urlParams.get('campaign') || sessionStorage.getItem('campaign_code') || 'default').trim();
            if (urlParams.get('campaignCode')) {
                sessionStorage.setItem('campaign_code', rawCampaignCode);
            }

            // Fetch campaign configuration parameters from campaigns.json API endpoint
            try {
                const res = await fetch(`/api/campaign/${rawCampaignCode}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.config) {
                        window.CAMPAIGN_VARS = data.config;
                        if (data.code) window.CAMPAIGN_VARS.rawCode = data.code;
                        console.log(' Loaded campaign parameters:', window.CAMPAIGN_VARS);
                    }
                }
            } catch (e) {
                console.warn('Failed to fetch campaign parameters from API, using defaults:', e);
            }

            // Initialize dynamic campaign parameters, artwork & terms URL
            const cVars = window.CAMPAIGN_VARS || {};
            const campaignCode = cVars.rawCode || rawCampaignCode || cVars.campaignCode || 'default';
            const platform = (cVars.campaignPlatform || 'meta').toLowerCase();
            const pixelId = cVars.pixelId || '';
            const productCode = cVars.productCode || 'bima_telemed_voucher';
            const price = Number(cVars.price) || 300;
            const currency = cVars.currency || 'PKR';
            const artworkImage = cVars.artworkImage || 'campaign2 artwork.jpeg';
            const backgroundColor = cVars.backgroundColor || '#0d2743';
            const textColor = cVars.textColor || '#ffffff';
            const termsUrl = cVars.termsUrl || 'terms_and_conditions_bima.html';
            const events = cVars.events || {};

            // Dynamically update page outer background color
            if (backgroundColor) {
                document.body.style.backgroundColor = backgroundColor;
            }

            // Dynamically update price text content and text color for all text elements including Terms link
            const priceInfoEl = document.getElementById('priceInfoEl');
            if (priceInfoEl) {
                const dailyAmount = Math.round(price / 30);
                priceInfoEl.textContent = `Only Rs. ${dailyAmount}/Day  Full family covered`;
                if (textColor) {
                    priceInfoEl.style.color = textColor;
                }
            }

            // Dynamically update consent label, consent text, and Terms & Conditions link text color
            if (textColor) {
                const consentTextEl = document.querySelector('.consent-text');
                if (consentTextEl) {
                    consentTextEl.style.color = textColor;
                }
                const consentLabelEl = document.querySelector('.consent-label');
                if (consentLabelEl) {
                    consentLabelEl.style.color = textColor;
                }
                const termsLinkEl = document.getElementById('termsLink');
                if (termsLinkEl) {
                    termsLinkEl.style.color = textColor;
                }
            }

            // Dynamically update container artwork background image
            const containerEl = document.querySelector('.container');
            if (containerEl && artworkImage) {
                containerEl.style.backgroundImage = `url('${artworkImage}')`;
            }

            // Dynamically update Terms & Conditions link href
            const termsLinkEl = document.getElementById('termsLink');
            if (termsLinkEl && termsUrl) {
                termsLinkEl.href = `${termsUrl}?returnUrl=${encodeURIComponent(window.location.pathname + window.location.search)}`;
            }

            // Dynamic Page View Event Tracking (picked from campaigns config)
            const pageViewEventName = events.page_view;
            if (pageViewEventName) {
                if (platform === 'meta') {
                    fireMetaEvent(pixelId, pageViewEventName, {
                        content_ids: [productCode],
                        content_type: 'product',
                        content_name: 'BIMA Telemedicine Voucher',
                        value: price,
                        currency: currency,
                        campaign_code: campaignCode,
                        pixel_id: pixelId
                    });
                } else if (platform === 'tiktok') {
                    fireTikTokEvent(pixelId, pageViewEventName, {
                        content_id: productCode,
                        content_type: 'product',
                        price: price,
                        value: price,
                        currency: currency,
                        campaign_code: campaignCode,
                        pixel_id: pixelId
                    });
                } else if (platform === 'google') {
                    fireGoogleEvent(pixelId, pageViewEventName, {
                        campaign_code: campaignCode
                    });
                }
            }

            const queryMsisdn = urlParams.get('msisdn');
            const detectedMsisdn = window.SERVER_DETECTED_MSISDN || queryMsisdn;

            let autoRedirectTriggered = false;

            if (detectedMsisdn) {
                populateMsisdn(detectedMsisdn);
            } else {
                // Auto-fetch header enrichment MSISDN
                fetch('/api/detect-msisdn')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.msisdn) {
                            populateMsisdn(data.msisdn);
                        }
                    })
                    .catch(err => console.error('Failed to auto-fetch MSISDN from headers:', err));
            }

            function populateMsisdn(rawVal) {
                if (!rawVal || autoRedirectTriggered) return;
                const cleanNum = rawVal.toString().replace(/[^0-9]/g, '');
                let localPart = cleanNum;
                if (cleanNum.startsWith('92')) {
                    localPart = cleanNum.substring(2);
                } else if (cleanNum.startsWith('03')) {
                    localPart = cleanNum.substring(1);
                } else if (cleanNum.startsWith('3') && cleanNum.length === 10) {
                    localPart = cleanNum;
                }
                const input = document.getElementById('phoneNumber');
                if (input && localPart.length === 10 && localPart.startsWith('3')) {
                    input.value = localPart;
                    console.log('Populated MSISDN from HE:', rawVal, '->', localPart);

                    // Auto-trigger subscription pipeline for HE detected numbers
                    autoRedirectTriggered = true;
                    autoTriggerSubscription();
                }
            }

            function autoTriggerSubscription() {
                const consentCb = document.getElementById('consentCheckbox');
                if (consentCb) consentCb.checked = true;

                showToast(' Phone number detected! Auto-redirecting to JazzCash...', true);

                setTimeout(() => {
                    const form = document.querySelector('.form-overlay');
                    if (form) {
                        if (typeof form.requestSubmit === 'function') {
                            form.requestSubmit();
                        } else {
                            handleSubmit(new Event('submit'));
                        }
                    }
                }, 800);
            }
        });
    </script>
</body>

</html>
