    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Outfit -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d2743;
            /* Dark background behind the container frame */
            height: 100vh;
            height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #ffffff;
            overflow: hidden;
        }

        /* 
           Responsive Aspect Ratio Container 
           Locks layout to 9:16 (1080x1920) matching the design image.
           Guarantees no scrollbars on any device or viewport.
        */
        .container {
            container-type: inline-size;
            position: relative;
            width: 100vw;
            height: 177.78vw;
            /* 16/9 ratio of viewport width */
            max-height: 100vh;
            max-height: 100dvh;
            max-width: 56.25vh;
            /* 9/16 ratio of viewport height */
            max-width: 56.25dvh;
            background-image: url('landing_page.png?v=5');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (max-width: 480px) and (max-aspect-ratio: 9/16) {

            /* Full screen on mobile tall viewports */
            .container {
                box-shadow: none;
            }
        }

        /* Form Overlay container spanning the lower portion */
        .form-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        /* 
           Input Box Overlay 
           Position: y=1403 to 1520, x=149 to 902 in 1080x1920
           Left: 13.80%, Top: 73.07%, Width: 69.72%, Height: 6.09%
        */
        .input-box-overlay {
            position: absolute;
            left: 13.80%;
            top: 73.07%;
            width: 69.72%;
            height: 6.09%;
            display: flex;
            align-items: center;
        }

        /* 
           Input field covering only the placeholder text area to the right of the JazzCash logo / divider
           Logo/Divider area takes about 19.5% of the width
        */
        .phone-input {
            position: absolute;
            left: 19.5%;
            top: 0;
            width: 80.5%;
            height: 100%;
            border: none;
            outline: none;
            background-color: #ffffff;
            /* White background to cover the printed placeholder text */
            color: #1e293b;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 0 12px;
            border-radius: 0 16px 16px 0;
            /* Match rounded corner of image box */
        }

        /* Responsive font sizing for input text */
        @media (max-height: 700px) {
            .phone-input {
                font-size: 14px;
            }
        }

        .phone-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        /* 
           Subscribe Button Overlay
           Position: y=1560 to 1684, x=149 to 902 in 1080x1920
           Left: 13.80%, Top: 81.25%, Width: 69.72%, Height: 6.46%
        */
        .subscribe-btn-overlay {
            position: absolute;
            left: 13.80%;
            top: 81.25%;
            width: 69.72%;
            height: 6.46%;
            background-color: #ffffff;
            /* Covers image button */
            color: #16497B;
            border: none;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        @media (max-height: 700px) {
            .subscribe-btn-overlay {
                font-size: 16px;
            }
        }

        .subscribe-btn-overlay:hover {
            background-color: #f8fafc;
            transform: scale(1.01);
        }

        .subscribe-btn-overlay:active {
            transform: scale(0.99);
        }

        .subscribe-btn-overlay:disabled {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        /* Consent Container (perfectly centered flex container to align checkbox and text) */
        .consent-container {
            position: absolute;
            left: 13.8%;
            width: 72.4%;
            /* Align with input and button bounds */
            top: 90.3%;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            z-index: 10;
        }

        .consent-label {
            display: flex;
            align-items: flex-start;
            cursor: pointer;
            user-select: none;
            width: 100%;
        }

        /* White text price info */
        .price-info {
            position: absolute;
            left: 0;
            top: 88.0%;
            width: 100%;
            text-align: center;
            font-size: 14.5px;
            font-size: clamp(10.5px, 2.8cqw, 14.5px);
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        /* White text consent overlay with active hyperlink */
        .consent-text {
            color: #ffffff;
            font-size: 10.5px;
            font-size: clamp(9px, 2.1cqw, 10.5px);
            line-height: 1.35;
            text-align: left;
            font-weight: 400;
        }

        .consent-text a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .consent-text a:hover {
            color: #FFE100;
        }

        /* Toast notifications */
        #toastMsg {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s ease;
            max-width: 90vw;
            text-align: center;
        }

        /* Custom Alert Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 39, 67, 0.85);
            /* Semi-transparent background matching theme color */
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(135deg, #133a63 0%, #0d2743 100%);
            border: 2px solid #1e4d7d;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 30px 24px 24px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #ffffff;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 225, 0, 0.15);
            /* Yellow tinted glow */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFE100;
            /* Yellow highlight color */
            animation: pulse-glow 2s infinite;
        }

        .modal-icon svg {
            width: 32px;
            height: 32px;
        }

        .modal-body {
            margin-bottom: 28px;
        }

        .modal-body p {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            color: #f1f5f9;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
        }

        .modal-btn {
            background-color: #FFE100;
            color: #0d2743;
            border: none;
            border-radius: 50px;
            padding: 12px 48px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 225, 0, 0.3);
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .modal-btn:active {
            transform: translateY(0);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 225, 0, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 225, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 225, 0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Interactive Overlay Form -->
        <form class="form-overlay" onsubmit="handleSubmit(event)">
            <!-- Phone Number Input Wrapper -->
            <div class="input-box-overlay">
                <input type="tel" class="phone-input" id="phoneNumber" placeholder="Enter your Jazzcash number" required
                    pattern="(03|3)[0-9]{9}" title="Please enter a valid JazzCash mobile number (e.g. 03XXXXXXXXX)">
            </div>

            <!-- Subscribe Action Button -->
            <button type="submit" class="subscribe-btn-overlay">Subscribe</button>

            <!-- Price Info Text (now rendered as White HTML text over the painted block) -->
            <div class="price-info">Only Rs. 10/Day – Full family covered</div>

            <!-- Consent Row (combining visible styled checkbox and text in a single container for perfect layout) -->
            <div class="consent-container">
                <label class="consent-label" for="consentCheckbox">
                    <input type="checkbox" id="consentCheckbox"
                        style="margin-top: 2px; margin-right: 6px; width: 13px; height: 13px; cursor: pointer; flex-shrink: 0;"
                        checked required>
                    <span class="consent-text">
                        By clicking Subscribe, you accept the <a
                            href="https://customerportal.milvikpakistan.com/telemedicine/terms-and-conditions"
                            target="_blank">Terms & Conditions</a>
                    </span>
                </label>
            </div>
        </form>
    </div>

    <!-- Toast Notification Box -->
    <div id="toastMsg"></div>

    <!-- Custom Alert Modal -->
    <div id="customAlert" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            </div>
            <div class="modal-body">
                <p id="customAlertMessage">You're already registered to Telemedicine Product, please reachout to 042 111
                    11 9878</p>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeCustomAlert()" class="modal-btn">OK</button>
            </div>
        </div>
    </div>

    <script>
        /* ── Utility: Custom Alert Modal ── */
        function showCustomAlert(message) {
            const modal = document.getElementById('customAlert');
            const messageEl = document.getElementById('customAlertMessage');
            messageEl.textContent = message;
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlert');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        /* ── Utility: Toast ── */
        function showToast(message, isSuccess) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = message;
            toast.style.background = isSuccess ? '#1db97b' : '#e74c3c';
            toast.style.display = 'block';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => { toast.style.display = 'none'; }, 400);
            }, 4000);
        }

        /* ── Utility: Button loading state ── */
        function setLoading(isLoading) {
            const btn = document.querySelector('.subscribe-btn-overlay');
            btn.disabled = isLoading;
            btn.textContent = isLoading ? 'Please wait…' : 'Subscribe';
            btn.style.opacity = isLoading ? '0.7' : '1';
        }

        /* ── Helper: SHA-256 Hashing ── */
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        /* ── Main form submission handler ── */
        async function handleSubmit(event) {
            event.preventDefault();

            const consentChecked = document.getElementById('consentCheckbox').checked;
            if (!consentChecked) {
                showToast('Please check the box to agree to the Terms & Conditions.', false);
                return;
            }

            const phoneNumberInput = document.getElementById('phoneNumber').value.trim();

            // Standardize phone number format
            let rawNum = phoneNumberInput.replace(/[^0-9]/g, '');
            if (rawNum.startsWith('92') && rawNum.length > 10) {
                rawNum = rawNum.substring(2);
            }
            if (rawNum.startsWith('0')) {
                rawNum = rawNum.substring(1);
            }

            if (rawNum.length !== 10 || !rawNum.startsWith('3')) {
                showToast('Please enter a valid 10 or 11-digit mobile number.', false);
                return;
            }

            // Standardize format: "0" + 10-digit number (e.g. 03XXXXXXXXX)
            const msisdn = '0' + rawNum;
            console.log('Processed MSISDN:', msisdn);

            // Format phone number to E.164 format (+923XXXXXXXXX) for TikTok matching
            const e164_phone = '+92' + rawNum;
            sessionStorage.setItem('user_phone_e164', e164_phone);

            if (window.ttq) {
                sha256(e164_phone).then(hashedPhone => {
                    window.ttq.identify({
                        phone_number: hashedPhone
                    });
                    window.ttq.track('Initiate Checkout_d');
                }).catch(err => {
                    console.error('TikTok identification hashing failed:', err);
                    window.ttq.track('Initiate Checkout_d');
                });
            }
            if (typeof gtag === 'function') {
                gtag('event', 'Initiate Checkout_d');
            }

            setLoading(true);

            try {
                // ── Step 1: Service search (POST request to prevent URL logging of PII) ──
                const serviceRes = await fetch('/api/service-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ msisdn })
                });
                const serviceData = await serviceRes.json().catch(() => ({}));
                console.log('✅ Service response:', serviceData);

                if (!serviceRes.ok) {
                    throw new Error(serviceData.message || serviceData.error || 'Service lookup failed: ' + serviceRes.status);
                }

                // Check if customer is already registered (if any subscriptionStatus != INACTIVE)
                const findAllFields = (obj, key) => {
                    let results = [];
                    if (!obj || typeof obj !== 'object') return results;
                    if (obj[key] !== undefined) {
                        results.push(obj[key]);
                    }
                    if (Array.isArray(obj)) {
                        for (let item of obj) {
                            results = results.concat(findAllFields(item, key));
                        }
                    } else {
                        for (let k in obj) {
                            if (typeof obj[k] === 'object') {
                                results = results.concat(findAllFields(obj[k], key));
                            }
                        }
                    }
                    return results;
                };

                const subscriptionStatuses = findAllFields(serviceData, 'subscriptionStatus');
                const isAlreadyRegistered = subscriptionStatuses.some(status =>
                    status && ['NO_PAY', 'ACTIVE', 'CONFIRMED'].includes(status.toUpperCase())
                );

                if (isAlreadyRegistered) {
                    if (window.ttq) {
                        window.ttq.track('duplicate');
                    }
                    if (typeof gtag === 'function') {
                        gtag('event', 'duplicate');
                    }
                    showCustomAlert("You're already registered to Telemedicine Product, please reachout to 042 111 11 9878");
                    return;
                }

                const paymentSessionToken = serviceData.paymentSessionToken;
                if (!paymentSessionToken) {
                    throw new Error('Verification session token missing from service response');
                }

                // ── Step 2: Fetch JazzCash DTC Form Data using session token ──
                const formRes = await fetch(`/api/jazzcash-form?token=${encodeURIComponent(paymentSessionToken)}`);
                const formData = await formRes.json();
                console.log('✅ JazzCash form configuration:', formData);

                if (!formRes.ok) {
                    throw new Error(formData.error || 'Failed to construct payment payload');
                }

                showToast('✓ Redirecting to JazzCash payment page…', true);

                // Build dynamic form submit redirect
                const jcForm = document.createElement('form');
                jcForm.method = 'POST';
                jcForm.action = formData.actionUrl;

                const excludedKeys = ['actionUrl'];
                Object.entries(formData).forEach(([key, val]) => {
                    if (excludedKeys.includes(key)) return;
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = val || '';
                    jcForm.appendChild(input);
                });

                document.body.appendChild(jcForm);
                sessionStorage.setItem('jazzcash_source', 'BimaVoucher/New_campaign.html');

                setTimeout(() => jcForm.submit(), 1000);

            } catch (err) {
                console.error('Activation pipeline failed:', err);
                showToast('⚠ ' + (err.message || 'Something went wrong. Please check your connection and try again.'), false);
            } finally {
                setLoading(false);
            }
        }

        /* ── Keep input digits only ── */
        document.getElementById('phoneNumber').addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        /* ── Auto-fetch MSISDN from mobile data headers or URL on load ── */
        window.addEventListener('DOMContentLoaded', () => {
            // First check if MSISDN is passed in URL query string (e.g. ?msisdn=03001234567)
            const urlParams = new URLSearchParams(window.location.search);
            const queryMsisdn = urlParams.get('msisdn');
            if (queryMsisdn) {
                populateMsisdn(queryMsisdn);
                return;
            }

            // Fallback: check headers via local API (works only if unencrypted http:// or local testing)
            fetch('/api/detect-msisdn')
                .then(res => res.json())
                .then(data => {
                    if (data && data.msisdn) {
                        populateMsisdn(data.msisdn);
                    }
                })
                .catch(err => console.error('Failed to auto-fetch MSISDN from headers:', err));

            function populateMsisdn(rawVal) {
                const cleanNum = rawVal.replace(/[^0-9]/g, '');
                let localPart = cleanNum;
                if (cleanNum.startsWith('92')) {
                    localPart = cleanNum.substring(2);
                } else if (cleanNum.startsWith('03')) {
                    localPart = cleanNum.substring(1);
                } else if (cleanNum.startsWith('3') && cleanNum.length === 10) {
                    localPart = cleanNum;
                }
                const input = document.getElementById('phoneNumber');
                if (input) {
                    input.value = localPart;
                    console.log('Populated MSISDN:', rawVal);
                }
            }
        });
    </script>
</body>
