    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 430px;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            padding: 12px 16px 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
        }

        @media (min-width: 431px) {
            body {
                padding: 10px;
            }

            .container {
                height: 96dvh;
                max-height: 96dvh;
                border-radius: 20px;
            }
        }

        .logo-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
            padding: 0 2px;
            flex-shrink: 0;
        }

        .logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
            background: transparent;
            padding: 2px;
            border-radius: 8px;
        }

        .logo-left {
            max-width: 160px;
        }

        .logo-right {
            max-width: 125px;
        }

        .heading {
            display: none;
        }

        .doctor-image {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 100%;
            max-height: 46vh;
            max-height: 46dvh;
            height: auto;
            margin: 0 auto 0 auto;
            border-radius: 0px;
            box-shadow: none;
            display: block;
            object-fit: contain;
            object-position: bottom center;
            background: transparent;
        }

        .form-container {
            flex: 1 1 auto;
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: 2.5px solid #ff6b6b;
            border-radius: 18px;
            padding: 16px 18px;
            margin-top: -2px;
            position: relative;
            z-index: 2;
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            font-size: 13.5px;
        }

        .phone-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .country-code {
            background: white;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            min-width: 68px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .country-code:hover {
            border-color: #0066cc;
            background: #f8f9fa;
        }

        .phone-number {
            flex: 1;
            background: white;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .phone-number:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .phone-number::placeholder {
            color: #a0aec0;
            font-weight: 500;
        }

        .continue-btn {
            width: 100%;
            background: linear-gradient(135deg, #4ecca7 0%, #3aab8e 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(78, 204, 167, 0.35);
        }

        .continue-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(78, 204, 167, 0.45);
        }

        .subscription-info {
            margin-top: 8px;
            font-size: 12.5px;
            color: #2d3748;

            margin-bottom: 2px;
        }

        .subscription-product {
            display: block;
            margin-top: 3px;
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .trust-text {
            margin-top: 6px;
            font-size: 10.5px;
            color: #64748b;

        }

        .trust-text a {

            .doctor-image {

            .country-code, .phone-number {

                font-size: 13px;

<body>
    <div class="container">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="logo-img logo-left">
            <img src="bima_logo.jpg" alt="BIMA" class="logo-img logo-right">
        </div>

        <div class="heading">
            <h1>GET CONNECTED</h1>
            <p>With Specialist <span class="highlight">Doctors in</span></p>
            <p><span class="highlight">Just a Click</span></p>
        </div>

        <img src="Bima Artwork.png" alt="Specialist Doctor" class="doctor-image">

        <form class="form-container" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label class="form-label">Phone Number for Video Consultation:</label>
                <div class="phone-input-wrapper">
                    <select class="country-code" id="countryCode">
                        <option value="+92">+92</option>
                    </select>
                    <input type="tel" class="phone-number" id="phoneNumber" placeholder="3XXXXXXXXX" required
                        pattern="[0-9]{10}" title="Please enter a 10-digit phone number">
                </div>
            </div>

            <button type="submit" class="continue-btn">Consult Doctor Now</button>
            <p class="subscription-info">
                BIMA Telemedicine Video Consultation
                <span class="subscription-product">Active Subscribers Only</span>
            </p>

            <p class="trust-text">By proceeding, you verify that you are active and accept our <a
                    href="https://customerportal.milvik.io/telemedicine/terms-and-conditions" target="_blank">Privacy
                    Policy and Terms</a>.</p>
        </form>
    </div>

    <!-- Toast notification -->
    <div id="toastMsg" style="
        display: none;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: #fff;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 13px;
        font-weight: 600;
        z-index: 9999;
        box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        transition: opacity 0.3s ease;
        max-width: 90vw;
        text-align: center;
    "></div>

    <script>
        /* ── Utility: Toast ── */
        function showToast(message, isSuccess) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = message;
            toast.style.background = isSuccess ? '#1db97b' : '#e74c3c';
            toast.style.display = 'block';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => { toast.style.display = 'none'; }, 400);
            }, 4000);
        }

        /* ── Utility: Button loading state ── */
        function setLoading(isLoading) {
            const btn = document.querySelector('.continue-btn');
            btn.disabled = isLoading;
            btn.textContent = isLoading ? 'Checking Eligibility…' : 'Consult Doctor Now';
            btn.style.opacity = isLoading ? '0.7' : '1';
            btn.style.cursor = isLoading ? 'not-allowed' : 'pointer';
        }

        /* ── Main form handler ── */
        async function handleSubmit(event) {
            event.preventDefault();

            const countryCode = document.getElementById('countryCode').value; // e.g. "+92"
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

            if (!phoneNumber || phoneNumber.length < 10) {
                showToast('Please enter a valid 10-digit phone number.', false);
                return;
            }

            // Build MSISDN in local format: 0 + 10-digit number = e.g. "03001234567"
            const msisdn = '0' + phoneNumber;
            console.log('Submitting MSISDN:', msisdn);

            setLoading(true);

            // Track button click / attempt to consult
            console.log('Tracking Event: form_submit_d');
            if (window.gtag) {
                gtag('event', 'form_submit_d');
            }
            if (window.fbq) {
                fbq('track', 'form_submit_d');
            }
            if (window.ttq) {
                ttq.track('form_submit_d');
            }

            try {
                // Call the new Python Flask backend /api/grant-access endpoint
                const response = await fetch('/api/grant-access', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ msisdn: msisdn })
                });

                let data = {};
                let isJson = false;
                try {
                    const text = await response.text();
                    try {
                        data = JSON.parse(text);
                        isJson = true;
                    } catch (e) {
                        data = { message: text };
                    }
                } catch (e) {
                    console.error("Failed to read response content:", e);
                }

                console.log('Grant access response:', data);

                // Handle the case where the customer is not registered (eligibility returns false)
                if (data.status === 'unregistered') {
                    showToast('⚠ ' + (data.message || 'No product is registered on the provider msisdn.'), false);
                    setTimeout(() => {
                        window.location.href = data.redirect_url || 'https://services.jazz.com.pk/signin/BIMAMHealth?ref=1&var=2&camp=BIMAMHealth_Jazz1';
                    }, 2500); // Allow time to see the toast notification
                    return;
                }

                if (!response.ok || data.status === 'error') {
                    // Extract message from JSON, otherwise fallback to HTML status code or default
                    const rawMsg = data.message || '';
                    const cleanMsg = isJson && rawMsg ? rawMsg : `Server returned error ${response.status} (${response.statusText || 'Bad Gateway'})`;
                    throw new Error(cleanMsg);
                }

                showToast('✓ Redirecting to video consultation…', true);

                // Redirect to deep_link returned from Python server
                setTimeout(() => {
                    window.location.href = data.deep_link;
                }, 1000); // Small delay to let the toast be visible

            } catch (err) {
                console.error('Telemedicine Redirect Error:', err);
                showToast('⚠ ' + (err.message || 'Verification or authorization failed. Please try again.'), false);
            } finally {
                setLoading(false);
            }
        }

        /* ── Phone number input: digits only ── */
        document.getElementById('phoneNumber').addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        /* ── Auto-fetch MSISDN from mobile data headers or URL on load ── */
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryMsisdn = urlParams.get('msisdn');
            if (queryMsisdn) {
                populateMsisdn(queryMsisdn);
                return;
            }

            // Fallback: check headers via external detector directly if on HTTP (to trigger carrier injection)
            const detectorUrl = window.location.protocol === 'https:'
                ? '/api/detect-msisdn'
                : 'http://54.154.2.113:8000/api/detect-msisdn';

            fetch(detectorUrl)
                .then(res => res.json())
                .then(data => {
                    if (data && data.msisdn) {
                        populateMsisdn(data.msisdn);
                    }
                })
                .catch(err => console.error('Failed to auto-fetch MSISDN from headers:', err));

            function populateMsisdn(rawVal) {
                const cleanNum = rawVal.replace(/[^0-9]/g, '');
                let localPart = cleanNum;
                if (cleanNum.startsWith('92')) {
                    localPart = cleanNum.substring(2);
                } else if (cleanNum.startsWith('03')) {
                    localPart = cleanNum.substring(1);
                } else if (cleanNum.startsWith('3') && cleanNum.length === 10) {
                    localPart = cleanNum;
                }
                const input = document.getElementById('phoneNumber');
                if (input) {
                    input.value = localPart;
                    console.log('Populated MSISDN:', rawVal);
                }
            }
        });

        /* ── Event tracking helper: msisdn enter ── */
        let msisdnTracked = false;
        function trackMsisdnEnter() {
            if (msisdnTracked) return;
            msisdnTracked = true;
            console.log('Tracking Event: select_content_d');
            if (window.gtag) {
                gtag('event', 'select_content_d');
            }
            if (window.fbq) {
                fbq('track', 'select_content_d');
            }
            if (window.ttq) {
                ttq.track('select_content_d');
            }
        }

        const phoneInput = document.getElementById('phoneNumber');
        if (phoneInput) {
            phoneInput.addEventListener('click', trackMsisdnEnter);
            phoneInput.addEventListener('focus', trackMsisdnEnter);
            phoneInput.addEventListener('input', trackMsisdnEnter);
        }
    </script>
